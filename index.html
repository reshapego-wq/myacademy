<link rel="icon" href="https://res.cloudinary.com/sxxuxdzy/image/upload/v1785748648/Reshape_Logo_pbcbku.jpg">

<style>
  :root {
    --primary: #123a5a;   /* changed from the admin page */
    --accent: #f2b631;    /* changed from the admin page */
    --chalk: #f6f7f2;
    --ink: #15231c;
    --muted: #56665d;
    --line: #dde3da;
    --surface: #ffffff;
    --danger: #b3261e;
    --ok: #1e7a46;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 76px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    font-family: "Alexandria", "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--chalk); color: var(--ink);
    font-size: 16px; line-height: 1.6;
  }
  html[dir="rtl"] body { line-height: 1.8; }
  img { max-width: 100%; display: block; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1140px; margin: 0 auto; padding: 0 22px; }

  /* ---------- Top bar ---------- */
  .bar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
  .bar .wrap { display: flex; align-items: center; gap: 18px; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 800; font-size: 1.05rem; }
  .brand img { height: 44px !important; width: auto !important; max-width: 180px; object-fit: contain !important; border-radius: 0; }
  .links { display: flex; gap: 22px; margin-inline-start: auto; }
  .links a { text-decoration: none; font-size: .92rem; font-weight: 500; color: var(--muted); }
  .links a:hover { color: var(--ink); }
  .lang { border: 1.5px solid var(--ink); background: transparent; color: var(--ink); font: inherit; font-weight: 700;
          font-size: .88rem; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .lang:hover { background: var(--ink); color: #fff; }
  @media (max-width: 820px) { .links { display: none; } .lang { margin-inline-start: auto; } }

  /* ---------- Hero ---------- */
  .hero { background: var(--primary); color: #fff; padding: 64px 0 56px; }
  .hero-grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 48px; align-items: center; }
  .tagline { display: inline-block; font-size: .85rem; font-weight: 700; color: var(--ink); background: var(--accent);
             padding: 5px 14px; border-radius: 999px; margin-bottom: 20px; }
  .hero h1 { font-size: clamp(2.1rem, 5vw, 3.7rem); line-height: 1.08; font-weight: 800; max-width: 16ch; letter-spacing: -0.01em; }
  html[dir="rtl"] .hero h1 { line-height: 1.35; letter-spacing: 0; }
  .hero .lead { font-size: clamp(1.02rem, 1.8vw, 1.15rem); max-width: 50ch; margin-top: 18px; opacity: .92; }
  .mosaic { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 170px; gap: 10px; }
  .mosaic img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; background: rgba(255,255,255,.08); }
  .mosaic.n1 { grid-template-columns: 1fr; grid-auto-rows: 300px; }
  .mosaic.n2 { grid-auto-rows: 240px; }
  .mosaic.n3 img:first-child { grid-column: span 2; }

  .programs-label { font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .75;
                    margin: 48px 0 12px; display: flex; align-items: center; gap: 12px; }
  .programs-label::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.3); }
  html[dir="rtl"] .programs-label { letter-spacing: 0; }
  .paths { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .path { display: block; text-decoration: none; padding: 18px 20px 20px; border-radius: 14px;
          background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.28); transition: border-color .2s, background .2s; }
  .path:hover { border-color: var(--accent); background: rgba(255,255,255,.12); }
  .path small { display: block; font-size: .78rem; color: var(--accent); font-weight: 700; margin-bottom: 6px; }
  .path b { display: block; font-size: 1.12rem; line-height: 1.3; }
  .path span { display: block; font-size: .88rem; opacity: .85; margin-top: 6px; }
  @media (max-width: 960px) { .hero-grid { grid-template-columns: 1fr; gap: 30px; } .paths { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px) {
    .hero { padding: 40px 0 36px; }
    .paths { grid-template-columns: 1fr; }
    .mosaic { grid-auto-rows: 120px; }
    .mosaic.n1 { grid-auto-rows: 200px; }
    .mosaic.n2 { grid-auto-rows: 150px; }
  }

  /* ---------- Numbers & clients ---------- */
  .strip { background: var(--surface); border-bottom: 1px solid var(--line); padding: 34px 0; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; }
  .stat b { display: block; font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: 800; color: var(--primary); line-height: 1.1; }
  .stat span { color: var(--muted); font-size: .92rem; }
  .clients { margin-top: 26px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 30px; }
  .stats + .clients { padding-top: 24px; border-top: 1px solid var(--line); }
  .clients .lbl { width: 100%; font-size: .82rem; color: var(--muted); font-weight: 600; }
  .clients img { height: 40px; width: auto; max-width: 130px; object-fit: contain; filter: grayscale(1); opacity: .75; }
  .clients img:hover { filter: none; opacity: 1; }
  .clients .name { font-weight: 700; color: var(--muted); }

  /* ---------- Events tabs ---------- */
  .seg { display: inline-flex; background: #e9ede6; border-radius: 12px; padding: 4px; margin-bottom: 28px; }
  .seg button { font: inherit; font-weight: 700; border: 0; background: transparent; color: var(--muted); padding: 10px 22px; border-radius: 9px; cursor: pointer; }
  .seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .evpanel[hidden] { display: none; }

  /* ---------- Sections ---------- */
  section.block { padding: 76px 0; }
  section.block + section.block { border-top: 1px solid var(--line); }
  .sec-head { max-width: 640px; margin-bottom: 34px; }
  .sec-head h2 { font-size: clamp(1.6rem, 3.4vw, 2.3rem); line-height: 1.15; font-weight: 800; }
  html[dir="rtl"] .sec-head h2 { line-height: 1.4; }
  .sec-head p { color: var(--muted); margin-top: 10px; font-size: 1.04rem; }

  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px 28px; }
  .feature { border-top: 4px solid var(--accent); padding-top: 14px; }
  .feature h3 { font-size: 1.05rem; margin-bottom: 4px; }
  .feature p { color: var(--muted); font-size: .94rem; }
  @media (max-width: 900px) { .features { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 520px) { .features { grid-template-columns: 1fr; } }

  .split { display: grid; grid-template-columns: 1fr 1.05fr; gap: 40px; align-items: start; }
  @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }

  /* Academy groups */
  .groups { list-style: none; border-top: 1px solid var(--line); }
  .groups li { display: grid; grid-template-columns: 96px 1fr auto; gap: 16px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .age { font-weight: 800; font-size: 1.5rem; color: var(--primary); line-height: 1.1; }
  .age small { display: block; font-size: .72rem; font-weight: 500; color: var(--muted); }
  .g-info { font-size: .94rem; }
  .g-info span { display: block; color: var(--muted); font-size: .86rem; }
  .price { text-align: end; font-weight: 700; white-space: nowrap; }
  .price small { display: block; font-weight: 400; color: var(--muted); font-size: .8rem; }
  @media (max-width: 520px) { .groups li { grid-template-columns: 70px 1fr; } .price { grid-column: 2; text-align: start; } }

  /* School event types */
  .types { list-style: none; display: grid; gap: 14px; }
  .seg { flex-wrap: wrap; }
  .acpanel[hidden] { display: none; }
  .branch-info { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin-bottom: 12px; font-size: .94rem; }
  .branch-info b { font-size: 1.05rem; }
  .branch-info span { color: var(--muted); }
  .branch-info a { color: var(--primary); font-weight: 700; }
  .types li { padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-inline-start: 4px solid var(--primary); border-radius: 10px; }
  .types b { display: block; }
  .types span { color: var(--muted); font-size: .92rem; }

  /* Summer events */
  .events { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; margin-bottom: 40px; }
  .event { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; }
  .event .date { color: var(--primary); font-weight: 700; font-size: .9rem; }
  .event h3 { font-size: 1.25rem; margin: 4px 0 8px; }
  .event p { color: var(--muted); font-size: .93rem; flex: 1; }
  .event .meta { display: flex; justify-content: space-between; gap: 10px; margin: 14px 0; font-size: .9rem; }
  .event .meta b { font-size: 1.05rem; }
  .event.closed { opacity: .65; }
  .ev-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .offer { background: var(--accent); color: var(--ink); font-size: .76rem; font-weight: 800; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .ev-note { margin-top: 12px; font-size: .86rem; font-weight: 600; color: var(--primary); background: #eef3ee; border-inline-start: 3px solid var(--primary); padding: 8px 12px; border-radius: 6px; }
  .tag { display: inline-block; font-size: .8rem; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: #eee; color: var(--muted); align-self: flex-start; }

  /* Buttons */
  .btn { display: inline-block; font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 13px 22px; cursor: pointer;
         background: var(--accent); color: var(--ink); text-decoration: none; text-align: center; }
  .btn:hover { filter: brightness(.95); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.dark { background: var(--primary); color: #fff; }
  .btn.line { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); }

  /* Forms */
  .form-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 26px; }
  .form-card h3 { font-size: 1.3rem; margin-bottom: 2px; }
  .form-card .note { color: var(--muted); font-size: .84rem; margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .grid .wide { grid-column: 1 / -1; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } .form-card { padding: 20px; } }
  label { display: block; font-size: .86rem; font-weight: 600; margin-bottom: 5px; }
  label .req { color: var(--danger); }
  input, select, textarea { width: 100%; font: inherit; font-size: .95rem; padding: 11px 13px; border: 1.5px solid var(--line);
                            border-radius: 9px; background: #fff; color: var(--ink); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
  input.bad, select.bad { border-color: var(--danger); }
  textarea { resize: vertical; min-height: 80px; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .form-card .btn { width: 100%; margin-top: 20px; }
  .msg { margin-top: 12px; font-size: .9rem; min-height: 1.3em; }
  .msg.err { color: var(--danger); }
  .done { text-align: center; padding: 24px 6px; }
  .done b { display: block; font-size: 1.25rem; color: var(--ok); margin-bottom: 6px; }
  .done p { color: var(--muted); margin-bottom: 18px; }
  .closed-box { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 24px; color: var(--muted); }

  /* Gallery */
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .gallery img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; }

  /* FAQ */
  .faq { max-width: 760px; }
  .faq details { border-bottom: 1px solid var(--line); padding: 16px 0; }
  .faq summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 16px; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; font-weight: 400; font-size: 1.4rem; line-height: 1; color: var(--primary); }
  .faq details[open] summary::after { content: "–"; }
  .faq p { color: var(--muted); margin-top: 8px; }

  /* Footer */
  footer { background: var(--primary); color: #fff; padding: 56px 0 90px; }
  footer h2 { font-size: 1.6rem; margin-bottom: 18px; }
  .contacts { display: flex; flex-wrap: wrap; gap: 12px; }
  .contacts a { text-decoration: none; padding: 10px 18px; border: 1.5px solid rgba(255,255,255,.4); border-radius: 999px; font-weight: 600; font-size: .92rem; }
  .contacts a:hover { border-color: var(--accent); }
  footer .addr { margin-top: 18px; opacity: .85; }
  footer .copy { margin-top: 30px; font-size: .8rem; opacity: .6; }

  .stats { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
  footer .site { color: var(--accent); }

  /* Inside the reshapego.com page (embed mode): their site already has a header */
  body.embed { background: transparent; }
  body.embed .bar { position: static; background: transparent; border: 0; }
  body.embed .bar .wrap { height: 52px; }
  body.embed .brand, body.embed .links, body.embed .wa { display: none; }
  body.embed footer { padding-bottom: 56px; }

  .wa { position: fixed; bottom: 18px; inset-inline-end: 18px; z-index: 30; background: #25d366; color: #fff; text-decoration: none;
        font-weight: 700; padding: 12px 18px; border-radius: 999px; box-shadow: 0 6px 18px rgba(0,0,0,.2); font-size: .92rem; }

  .state { padding: 120px 22px; text-align: center; color: var(--muted); }
</style>
</head>

// ============================================================
// State
// ============================================================
const API = window.RESHAPE_API || "";
const CACHE_KEY = "reshape_content_v1";
let content = null;
let lang = pickLang();
const done = {};   // forms that were just sent
let evTab = /schools/.test(location.hash) ? "schools" : "companies";

// ?embed=1 = shown inside a page of reshapego.com (in an iframe)
const EMBED = new URLSearchParams(location.search).get("embed") === "1";
if (EMBED) {
  document.body.classList.add("embed");
  const sendHeight = () => parent.postMessage({ reshapeHeight: document.documentElement.scrollHeight }, "*");
  if (window.ResizeObserver) new ResizeObserver(sendHeight).observe(document.body);
  window.addEventListener("load", sendHeight);
}
// Scroll to a part of the page (inside reshapego.com, ask the parent page to scroll)
function goTo(el, block) {
  if (!el) return;
  if (EMBED) parent.postMessage({ reshapeScrollTo: Math.max(0, el.getBoundingClientRect().top + window.scrollY - 20) }, "*");
  else el.scrollIntoView({ block: block || "start" });
}

function pickLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "ar" || q === "en") return q;
  try { return localStorage.getItem("reshape_lang") === "ar" ? "ar" : "en"; } catch (e) { return "en"; }
}

function esc(v) {
  return String(v === null || v === undefined ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function safeUrl(u) { u = String(u || "").trim(); return /^https?:\/\//i.test(u) ? u : ""; }
function loc(o) { return (o && (o[lang] || o.en)) || ""; }
function money(n) {
  if (n === "" || n === null || n === undefined || isNaN(Number(n))) return "";
  return Number(n).toLocaleString("en-US") + " " + loc(content.brand.currency);
}
// items hidden from the admin page are skipped
function vis(arr) { return (arr || []).filter(x => !(x && typeof x === "object" && x.hidden)); }
function urlOf(x) { return typeof x === "string" ? x : (x && x.url) || ""; }
function digits(s) { return String(s || "").replace(/\D/g, ""); }
// WhatsApp needs the international number without + or 00: 201222470149
function waNumber(s) {
  let d = digits(s);
  if (d.startsWith("00")) d = d.slice(2);
  if (d.length === 11 && d.startsWith("01")) d = "2" + d;      // Egyptian mobile written as 01xxxxxxxxx
  return d.length >= 10 ? d : "";
}
function waLink(s) {
  const msg = lang === "ar" ? "مرحبًا، أريد معرفة المزيد عن برامج Reshape" : "Hello, I'd like to know more about Reshape programs";
  return "https://wa.me/" + waNumber(s) + "?text=" + encodeURIComponent(msg);
}

function formFields(kind) {
  const t = T[lang], c = content;
  if (kind === "academy") return [
    { k: "childName", req: 1 }, { k: "birthDate", type: "date", req: 1 },
    { k: "parentName", req: 1 }, { k: "phone", type: "tel", req: 1 },
    { k: "email", type: "email" }, { k: "school" },
  ].concat(branches().length > 1 ? [{ k: "branch", type: "select", req: 1, options: branches().map(b => ({ v: b.id, l: loc(b.name) })) }] : []).concat([
    { k: "group", type: "select", wide: branches().length < 2 ? 1 : 0, options: groupOptions(), placeholder: acBranch ? "" : t.branchFirst },
    { k: "playedBefore", type: "select", options: [{ v: "Yes", l: t.yes }, { v: "No", l: t.no }] },
    { k: "health", type: "textarea", wide: 1 }
  ]);
  if (kind === "schools") return [
    { k: "schoolName", req: 1 }, { k: "contactName", req: 1 },
    { k: "role" }, { k: "phone", type: "tel", req: 1 },
    { k: "email", type: "email" },
    { k: "eventType", type: "select", req: 1, options: vis(c.schools.eventTypes).map(x => ({ v: x.id, l: loc(x.name) })) },
    { k: "preferredDate", type: "date" }, { k: "students", type: "number" },
    { k: "ages", wide: 1 }, { k: "notes", type: "textarea", wide: 1 }
  ];
  if (kind === "companies") return [
    { k: "companyName", req: 1 }, { k: "contactName", req: 1 },
    { k: "role" }, { k: "phone", type: "tel", req: 1 },
    { k: "email", type: "email" },
    { k: "eventType", type: "select", req: 1, options: vis((c.companies || {}).eventTypes).map(x => ({ v: x.id, l: loc(x.name) })) },
    { k: "preferredDate", type: "date" }, { k: "people", type: "number" },
    { k: "venue", wide: 1 }, { k: "notes", type: "textarea", wide: 1 }
  ];
  return [
    { k: "childName", req: 1 }, { k: "age", type: "number", req: 1 },
    { k: "parentName", req: 1 }, { k: "phone", type: "tel", req: 1 },
    { k: "email", type: "email" }, { k: "children", type: "number" },
    { k: "event", type: "select", req: 1, wide: 1, options: openEvents().map(e => ({ v: e.id, l: loc(e.name) + (loc(e.dates) ? " (" + loc(e.dates) + ")" : "") })) },
    { k: "notes", type: "textarea", wide: 1 }
  ];
}
// Academy branches (older saved content had one list of groups: treat it as one branch)
let acBranch = "";
function branches() {
  const a = content.academy || {};
  if (Array.isArray(a.branches)) return vis(a.branches);
  return [{ id: "b1", name: { en: "", ar: "" }, address: { en: "", ar: "" }, groups: a.groups || [] }];
}
function groupOptions() {
  const t = T[lang], br = branches().find(b => b.id === acBranch);
  if (!br) return [];
  return vis(br.groups).map(g => ({ v: g.id, l: t.ages + " " + g.ages + ", " + loc(g.days) + " " + (g.time || "") })).concat([{ v: "", l: t.notSure }]);

function refreshGroupSelect() {
  const sel = document.getElementById("academy-group");
  if (!sel) return;
  const t = T[lang];
  sel.innerHTML = '<option value="">' + esc(acBranch ? t.choose : t.branchFirst) + "</option>" +
    groupOptions().map(o => '<option value="' + esc(o.v) + '">' + esc(o.l) + "</option>").join("");
}
function setAcTab(id, alsoForm) {
  document.querySelectorAll("[data-actab]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.actab === id)));
  document.querySelectorAll(".acpanel").forEach(p => p.hidden = p.id !== "acp-" + id);
  if (alsoForm) {
    acBranch = id;
    const bs = document.getElementById("academy-branch");
    if (bs) bs.value = id;
    refreshGroupSelect();
  }
}

function openEvents() { return vis(content.summer.events).filter(e => e.open !== false); }

function fieldHtml(kind, f) {
  const t = T[lang], id = kind + "-" + f.k;
  const label = '<label for="' + id + '">' + esc(t.f[f.k]) + (f.req ? ' <span class="req">*</span>' : "") + "</label>";
  let ctl;
  if (f.type === "select") {
    ctl = '<select id="' + id + '" name="' + f.k + '"' + (f.req ? " required" : "") + '><option value="">' + esc(f.placeholder || t.choose) + "</option>" +
      f.options.map(o => '<option value="' + esc(o.v) + '">' + esc(o.l) + "</option>").join("") + "</select>";
  } else if (f.type === "textarea") {
    ctl = '<textarea id="' + id + '" name="' + f.k + '" rows="3"></textarea>';
  } else {
    const type = f.type || "text";
    const extra = type === "tel" ? ' inputmode="tel" autocomplete="tel" dir="ltr"' :
                  type === "email" ? ' autocomplete="email" dir="ltr"' :
                  type === "number" ? ' min="0" inputmode="numeric"' : "";
    ctl = '<input id="' + id + '" name="' + f.k + '" type="' + type + '"' + extra + (f.req ? " required" : "") + ">";
  }
  return '<div' + (f.wide ? ' class="wide"' : "") + ">" + label + ctl + "</div>";
}

function formHtml(kind) {
  const t = T[lang];
  if (done[kind]) {
    return '<div class="form-card" id="form-' + kind + '"><div class="done"><b>' + esc(t.doneTitle[kind]) + "</b><p>" + esc(t.doneText) +
      '</p><button class="btn line" type="button" data-again="' + kind + '">' + esc(t.another) + "</button></div></div>";
  }
  return '<form class="form-card" id="form-' + kind + '" data-kind="' + kind + '" novalidate>' +
    "<h3>" + esc(t.formTitle[kind]) + '</h3><p class="note">' + esc(t.reqNote) + "</p>" +
    '<div class="grid">' + formFields(kind).map(f => fieldHtml(kind, f)).join("") + "</div>" +
    '<input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">' +
    '<button class="btn dark" type="submit">' + esc(t.sendBtn[kind]) + "</button>" +

}

function render() {
  const t = T[lang], c = content, b = c.brand;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

    evPanel("schools", c.schools) + evPanel("companies", c.companies) + "</div></section>";

  // ---- Summer
  const evs = vis(c.summer.events);
  h += '<section class="block" id="summer"><div class="wrap"><div class="sec-head"><h2>' + esc(t.summerTitle) + "</h2><p>" + esc(loc(c.summer.intro)) + "</p></div>";

    h += '<div class="events">' + evs.map(e => {

        (open ? '<button class="btn" type="button" data-pick="' + esc(e.id) + '">' + esc(t.registerFor) + "</button>" : '<span class="tag">' + esc(t.full) + "</span>") +

  const branchInfo = br => (loc(br.name) || loc(br.address) || safeUrl(br.mapUrl))
    ? '<div class="branch-info">' + (loc(br.name) ? "<b>" + esc(loc(br.name)) + "</b>" : "") + (loc(br.address) ? "<span>" + esc(loc(br.address)) + "</span>" : "") +
      (safeUrl(br.mapUrl) ? '<a href="' + esc(safeUrl(br.mapUrl)) + '" target="_blank" rel="noopener">' + esc(t.directions) + "</a>" : "") + "</div>" : "";
  h += '<section class="block" id="academy"><div class="wrap split"><div><div class="sec-head"><h2>' + esc(t.academyTitle) + "</h2><p>" + esc(loc(c.academy.intro)) + "</p></div>" +

    brs.map(br => '<div class="acpanel" id="acp-' + esc(br.id) + '"' + (br.id === showTab ? "" : " hidden") + ">" + branchInfo(br) + groupList(vis(br.groups)) + "</div>").join("") +
    "</div><div>" + (c.academy.open === false ? '<div class="closed-box">' + esc(t.academyClosed) + "</div>" : formHtml("academy")) + "</div></div></section>";

  // ---- Why us
  if (vis(c.features).length) {

  }

  // ---- FAQ
  if (vis(c.faq).length) {

    "</div>" + (loc(b.address) ? '<p class="addr">' + esc(loc(b.address)) + "</p>" : "") +

// A photo that can't load is removed, and the photo grid adjusts (or disappears)
function fixMosaic(img) {
  const m = img.parentNode;
  img.remove();
  if (!m) return;
  const n = m.querySelectorAll("img").length;
  if (!n) m.remove(); else m.className = "mosaic n" + n;
}

function setEvTab(k) {
  evTab = k;
  document.querySelectorAll(".seg [data-evtab]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.evtab === k)));
  document.querySelectorAll(".evpanel").forEach(p => p.hidden = p.id !== "panel-" + k);
}

function saveTyped() {
  const out = {};
  document.querySelectorAll("form[data-kind]").forEach(f => {
    out[f.dataset.kind] = {};
    f.querySelectorAll("[name]").forEach(el => { if (el.name !== "website") out[f.dataset.kind][el.name] = el.value; });
  });
  return out;
}
function restoreTyped(typed) {
  Object.keys(typed).forEach(kind => {
    const f = document.getElementById("form-" + kind);
    if (!f || f.tagName !== "FORM") return;
    Object.keys(typed[kind]).forEach(n => { const el = f.elements[n]; if (el) el.value = typed[kind][n]; });
  });
}

// ============================================================
// Events
// ============================================================
document.getElementById("langBtn").addEventListener("click", () => {
  lang = lang === "en" ? "ar" : "en";
  try { localStorage.setItem("reshape_lang", lang); } catch (e) {}
  if (content) render();
});

document.addEventListener("click", e => {
  const at = e.target.closest("[data-actab]");
  if (at) setAcTab(at.dataset.actab, true);
  const tab = e.target.closest("[data-evtab]");
  if (tab) setEvTab(tab.dataset.evtab);
  const pick = e.target.closest("[data-pick]");
  if (pick) {
    const sel = document.getElementById("summer-event");
    if (sel) { sel.value = pick.dataset.pick; goTo(document.getElementById("form-summer")); sel.focus({ preventScroll: true }); }
  }
  const again = e.target.closest("[data-again]");
  if (again) { delete done[again.dataset.again]; render(); goTo(document.getElementById("form-" + again.dataset.again)); }
  // inside reshapego.com, in-page links must scroll the parent page
  const a = e.target.closest('a[href^="#"]');
  if (a && EMBED) { e.preventDefault(); goTo(document.querySelector(a.getAttribute("href"))); }
});

document.addEventListener("change", e => {
  if (e.target.id === "academy-branch") { acBranch = e.target.value; refreshGroupSelect(); if (acBranch) setAcTab(acBranch, false); }
});

document.addEventListener("submit", async e => {
  const form = e.target.closest("form[data-kind]");
  if (!form) return;
  e.preventDefault();
  const t = T[lang], kind = form.dataset.kind, msg = form.querySelector(".msg"), btn = form.querySelector("button[type=submit]");
  msg.className = "msg"; msg.textContent = "";
  form.querySelectorAll(".bad").forEach(el => el.classList.remove("bad"));

  const data = {};
  formFields(kind).forEach(f => { data[f.k] = (form.elements[f.k].value || "").trim(); });
  if (kind === "academy" && !data.branch) data.branch = acBranch;

  const missing = formFields(kind).filter(f => f.req && !data[f.k]);
  if (missing.length) {
    missing.forEach(f => form.elements[f.k].classList.add("bad"));
    msg.className = "msg err"; msg.textContent = t.missing + missing.map(f => t.f[f.k]).join(lang === "ar" ? "، " : ", ");
    form.elements[missing[0].k].focus();
    return;
  }
  if (digits(data.phone).length < 8) {
    form.elements.phone.classList.add("bad");
    msg.className = "msg err"; msg.textContent = t.badPhone; form.elements.phone.focus();
    return;
  }

  btn.disabled = true; btn.textContent = t.sending;
  try {
    const res = await fetch(API, {
      method: "POST",
      body: JSON.stringify({ action: "submit", form: kind, lang: lang, website: form.elements.website.value, data: data })
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || "error");
    done[kind] = true;
    form.reset();
    render();
    goTo(document.getElementById("form-" + kind));
  } catch (err) {
    msg.className = "msg err";
    msg.textContent = err instanceof TypeError ? t.netErr : t.serverErr + err.message;
    btn.disabled = false; btn.textContent = t.sendBtn[kind];
  }
});

// ============================================================
// Load content (instant from the last visit, then fresh from Google)
// ============================================================
(function start() {
  if (!API || API.indexOf("PASTE_") === 0) {
    document.getElementById("app").innerHTML = '<div class="state">' + esc(T.en.notConfigured) + "</div>";
    return;
  }
  try { const c = JSON.parse(localStorage.getItem(CACHE_KEY)); if (c && c.brand) { content = c; render(); } } catch (e) {}
  fetch(API + "?action=content")
    .then(r => r.json())
    .then(j => {
      if (!j.ok) throw new Error(j.error);
      content = j.content;
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(content)); } catch (e) {}
      render();
      if (location.hash && !EMBED) { try { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); } catch (e) {} }
    })
    .catch(() => { if (!content) document.getElementById("app").innerHTML = '<div class="state">' + esc(T[lang].loadErr) + "</div>"; });
})();
</script>
