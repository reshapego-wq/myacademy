<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Payments report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --primary: #123a5a; --accent: #f2b631; --ink: #15231c; --muted: #5b6b62; --line: #dde3da; --bg: #f4f6f2; --danger: #b3261e; --warn: #a86b12; --ok: #1e7a46; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Alexandria", "Segoe UI", Tahoma, Arial, sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button, select, input { font: inherit; }
  .btn { background: var(--primary); color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 700; cursor: pointer; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn:disabled { opacity: .5; cursor: default; }

  #login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login-box { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 28px; width: 100%; max-width: 360px; }
  .login-box h1 { font-size: 1.2rem; margin-bottom: 16px; }
  .login-box label { display: block; font-weight: 700; font-size: .85rem; margin-bottom: 4px; }
  .login-box input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
  .login-box .btn { width: 100%; margin-top: 14px; padding: 11px; }
  #loginErr { color: var(--danger); font-size: .85rem; margin-top: 10px; min-height: 1.2em; }

  #app { display: none; }
  .top { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid var(--line); }
  .top-in { max-width: 1400px; margin: 0 auto; padding: 10px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .top img { height: 36px; width: auto; max-width: 140px; object-fit: contain; }
  .top h1 { font-size: 1rem; margin-inline-end: 6px; }
  .top select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; min-width: 240px; flex: 1; max-width: 420px; background: #fff; }
  .top .right { margin-inline-start: auto; display: flex; gap: 8px; }
  main { max-width: 1400px; margin: 0 auto; padding: 22px 20px 70px; }

  .print-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .print-head img { height: 48px; width: auto; max-width: 170px; object-fit: contain; display: none; }
  .print-head h2 { font-size: 1.5rem; line-height: 1.2; }
  .print-head p { color: var(--muted); font-size: .85rem; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 26px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; border-top: 4px solid var(--primary); }
  .card span { display: block; font-size: .78rem; color: var(--muted); font-weight: 600; }
  .card b { display: block; font-size: 1.55rem; font-weight: 800; line-height: 1.25; margin-top: 2px; }
  .card small { display: block; color: var(--muted); font-size: .78rem; }
  .card.good { border-top-color: var(--ok); } .card.good b { color: var(--ok); }
  .card.warn { border-top-color: var(--accent); }
  .card.bad { border-top-color: var(--danger); } .card.bad b { color: var(--danger); }

  section { margin-bottom: 28px; }
  section h3 { font-size: 1.02rem; margin-bottom: 4px; }
  section .hint { color: var(--muted); font-size: .82rem; margin-bottom: 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 1000px) { .two { grid-template-columns: 1fr; } }

  .tbl-wrap { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: start; font-size: .75rem; color: var(--muted); font-weight: 700; padding: 9px 10px; border-bottom: 2px solid var(--line); white-space: nowrap; background: #fafbf8; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: end; white-space: nowrap; }
  tfoot td { font-weight: 800; background: #fafbf8; border-top: 2px solid var(--line); }
  .muted { color: var(--muted); }
  .over { color: var(--danger); font-weight: 700; }
  .pill { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .pill.Paid { background: #dff1e6; color: var(--ok); }
  .pill.Partially { background: #fdf3e1; color: var(--warn); }
  .pill.New { background: #e7e9e4; color: var(--muted); }
  .pill.Cancelled { background: #fbe9e7; color: var(--danger); }

  .counts { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .count-box { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; break-inside: avoid; }
  .count-box h4 { font-size: .88rem; margin-bottom: 8px; }
  .bar-row { display: grid; grid-template-columns: minmax(70px, 40%) 1fr 34px; gap: 8px; align-items: center; font-size: .82rem; margin: 3px 0; }
  .bar { height: 8px; background: #edf0ea; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--primary); }
  .bar-row b { text-align: end; }

  .attn { background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  .attn div { padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: .88rem; }
  .attn div:last-child { border-bottom: 0; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .toolbar input { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; min-width: 220px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: .82rem; font-weight: 600; color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
  .reg td input, .reg td select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .reg td input[type=number] { width: 96px; text-align: end; }
  .reg td input.note { min-width: 160px; width: 100%; }
  .reg td select { max-width: 170px; }
  .reg tr.cancelled td { opacity: .55; }
  .saving { font-size: .72rem; color: var(--muted); white-space: nowrap; }
  .saving.err { color: var(--danger); }
  .cancel { display: flex; align-items: center; gap: 4px; font-size: .75rem; color: var(--muted); margin-top: 4px; cursor: pointer; }
  .empty { padding: 26px; text-align: center; color: var(--muted); }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 20px; border-radius: 8px; display: none; z-index: 50; max-width: 90vw; }
  #toast.err { background: var(--danger); }

  /* ---------- Printing ---------- */
  @page { size: A4 landscape; margin: 12mm; }
  @media print {
    body { background: #fff; font-size: 10.5px; }
    .top, .toolbar, .no-print, #toast { display: none !important; }
    main { padding: 0; max-width: none; }
    .print-head img { display: block; }
    .card, .count-box, .tbl-wrap, .attn { border-color: #bbb; }
    .cards { grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .card { padding: 8px 10px; } .card b { font-size: 1.15rem; }
    .two { grid-template-columns: 1fr 1fr; }
    .tbl-wrap { overflow: visible; }
    section { break-inside: avoid; }
    section.regs { break-inside: auto; }
    tr { break-inside: avoid; }
    .reg td input, .reg td select { border: 0; padding: 0; background: none; appearance: none; -webkit-appearance: none; width: auto; min-width: 0; }
    .reg td input[type=number] { width: auto; }
    .cancel, .saving { display: none; }
    .bar i { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    .pill, .card { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div id="login">
  <form class="login-box" id="loginForm">
    <h1>Payments report</h1>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button class="btn" type="submit" id="loginBtn">Sign in</button>
    <p id="loginErr" role="alert"></p>
  </form>
</div>

<div id="app">
  <div class="top"><div class="top-in">
    <img id="logo" alt="">
    <h1>Payments</h1>
    <select id="formSel" aria-label="Camp or event"></select>
    <div class="right">
      <button class="btn ghost" type="button" id="refreshBtn">Refresh</button>
      <button class="btn" type="button" id="printBtn">Print</button>
      <button class="btn ghost" type="button" id="logoutBtn">Sign out</button>
    </div>
  </div></div>
  <main id="report"><p class="empty">Choose a camp or event.</p></main>
</div>
<div id="toast" role="status"></div>

<script src="config.js"></script>
<script>
const API = window.RESHAPE_API || "";
let PW = "", FORMS = [], BRAND = {}, CUR = "EGP", R = null;   // R = { form, rows }
let filter = "all", search = "";

function esc(v) { return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
function en(o) { return (o && (o.en || o.ar)) || ""; }
function money(n) { return n == null ? "–" : Math.round(n).toLocaleString("en-US") + " " + CUR; }
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
let tt;
function toast(m, k) { const t = document.getElementById("toast"); t.textContent = m; t.className = k || ""; t.style.display = "block"; clearTimeout(tt); tt = setTimeout(() => t.style.display = "none", k === "err" ? 7000 : 3000); }
async function post(body) { const r = await fetch(API, { method: "POST", body: JSON.stringify(body) }); return r.json(); }

// ---------- which answers to use for name / phone ----------
function keyFields() {
  const fs = R.form.fields.filter(f => !f.hidden);
  const texts = fs.filter(f => f.type === "text");
  const child = texts.find(f => /child|kid|طفل/i.test(en(f.label))) || texts[0];
  const parent = texts.find(f => /parent|ولي/i.test(en(f.label)) && f !== child);
  const phone = fs.find(f => f.type === "phone");
  return { child, parent, phone };
}
const isActive = r => r.status !== "Cancelled";
const isOverdue = r => isActive(r) && r.remaining > 0 && r.due && r.due < today();
const statusClass = s => s === "Partially paid" ? "Partially" : s;
const statusText = s => s === "New" ? "Not paid yet" : s;

// ---------- drawing ----------
function render() {
  const main = document.getElementById("report");
  if (!R) { main.innerHTML = '<p class="empty">Choose a camp or event.</p>'; return; }
  const k = keyFields();
  main.innerHTML = '<div id="summary"></div>' +
    '<section class="regs"><h3>All registrations</h3><p class="hint no-print">Choose the offer, type what was paid, the next due date and the method. Each change is saved to the sheet straight away. Status is worked out by itself.</p>' +
    '<div class="toolbar"><input type="search" id="search" placeholder="Search name or phone" value="' + esc(search) + '">' +
    [["all", "All"], ["owing", "Still owe"], ["paid", "Paid"], ["nooffer", "No offer"], ["cancelled", "Cancelled"]]
      .map(([v, l]) => '<button class="chip" type="button" data-filter="' + v + '" aria-pressed="' + (filter === v) + '">' + l + "</button>").join("") + "</div>" +
    '<div class="tbl-wrap"><table class="reg"><thead><tr><th>#</th><th>Received</th><th>Child</th>' + (k.parent ? "<th>Parent</th>" : "") +
    '<th>Phone</th><th>Offer</th><th class="num">Price</th><th class="num">Paid</th><th class="num">Remaining</th><th>Due date</th><th>Method</th><th>Status</th><th>Notes</th><th class="no-print"></th></tr></thead><tbody id="regBody"></tbody></table></div></section>';
  renderSummary();
  drawRows();
}

// Everything above the registrations table (redrawn after each save; the table itself is not)
function renderSummary() {
  const box = document.getElementById("summary");
  if (!box) return;
  const f = R.form, rows = R.rows, act = rows.filter(isActive), k = keyFields();
  const sum = (a, fn) => a.reduce((s, x) => s + (fn(x) || 0), 0);
  const owing = act.filter(r => r.remaining > 0);
  const overdue = act.filter(isOverdue);
  const paidFull = act.filter(r => r.status === "Paid");
  const noOffer = act.filter(r => !r.offer);
  const now = new Date();

  let h = '<div class="print-head"><img src="' + esc(BRAND.logo || "") + '" alt=""><div><h2>' + esc(en(f.title)) + "</h2><p>Payments report, " +
    now.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }) + " " + now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) + "</p></div></div>";

  // Cards
  h += '<div class="cards">' +
    card("", "Children registered", act.length, rows.length - act.length ? (rows.length - act.length) + " cancelled" : "") +
    card("good", "Paid in full", paidFull.length, "of " + act.length) +
    card("good", "Collected", money(sum(act, r => r.paid)), "") +
    card("", "Expected total", money(sum(act, r => r.price)), noOffer.length ? "without " + noOffer.length + " with no offer yet" : "") +
    card(owing.length ? "warn" : "", "Still owed", money(sum(owing, r => r.remaining)), owing.length + (owing.length === 1 ? " person" : " people")) +
    card(overdue.length ? "bad" : "", "Overdue", overdue.length, overdue.length ? money(sum(overdue, r => r.remaining)) : "none") +
    card(noOffer.length ? "warn" : "", "No offer chosen", noOffer.length, noOffer.length ? "choose it in the table" : "all set") +
    "</div>";

  // By offer + payments due
  const offerNames = f.offers.map(o => o.name);
  const byOffer = f.offers.map(o => ({ name: o.name, price: o.price, list: act.filter(r => r.offer === o.name) }))
    .filter(o => o.list.length || !f.offers.find(x => x.name === o.name).hidden);
  const other = act.filter(r => r.offer && offerNames.indexOf(r.offer) < 0);
  h += '<div class="two"><section><h3>By offer</h3><p class="hint">Only children who are not cancelled.</p><div class="tbl-wrap"><table><thead><tr><th>Offer</th><th class="num">Price</th><th class="num">Children</th><th class="num">Expected</th><th class="num">Collected</th><th class="num">Owed</th></tr></thead><tbody>' +
    byOffer.map(o => offerRow(o.name, money(o.price), o.list)).join("") +
    (other.length ? offerRow("Other", "", other) : "") +
    (noOffer.length ? offerRow("No offer yet", "", noOffer) : "") +
    "</tbody><tfoot>" + offerRow("Total", "", act) + "</tfoot></table></div></section>";

  const due = owing.slice().sort((a, b) => (a.due || "9999") < (b.due || "9999") ? -1 : 1);
  h += '<section><h3>Payments still due</h3><p class="hint">Sorted by due date. Red means the date has passed.</p><div class="tbl-wrap">' +
    (due.length ? "<table><thead><tr><th>Child</th><th>Phone</th><th>Offer</th><th class=\"num\">Remaining</th><th>Due date</th></tr></thead><tbody>" +
      due.map(r => "<tr><td>" + esc(ans(r, k.child)) + '</td><td dir="ltr">' + esc(ans(r, k.phone)) + "</td><td>" + esc(r.offer) +
        '</td><td class="num">' + money(r.remaining) + '</td><td class="' + (isOverdue(r) ? "over" : r.due ? "" : "muted") + '">' + esc(r.due || "no date yet") + (isOverdue(r) ? " (overdue)" : "") + "</td></tr>").join("") +
      "</tbody></table>" : '<p class="empty">Nobody owes money right now.</p>') + "</div></section></div>";

  // Camp details from the answers
  const choiceFields = f.fields.filter(x => !x.hidden && ["select", "radio", "checkbox", "yesno"].indexOf(x.type) >= 0);
  if (choiceFields.length && act.length) {
    h += '<section><h3>Camp details</h3><p class="hint">Counted from the answers of children who are not cancelled. Useful for T-shirts, meals and planning.</p><div class="counts">' +
      choiceFields.map(x => countBox(x, act)).join("") + "</div></section>";
  }

  // Needs attention: answers to follow-up questions (allergies, special needs…)
  const follow = f.fields.filter(x => !x.hidden && x.showIf && x.showIf.field);
  const notes = [];
  act.forEach(r => follow.forEach(x => { const a = r.answers[x.id]; if (a) notes.push("<div><b>" + esc(ans(r, k.child)) + "</b>: " + esc(en(x.label)) + " <span class=\"muted\">→</span> " + esc(a) + "</div>"); }));
  if (notes.length) h += '<section><h3>Needs attention</h3><p class="hint">Answers to follow-up questions, such as allergies and special needs.</p><div class="attn">' + notes.join("") + "</div></section>";

  box.innerHTML = h;
}

function card(cls, label, value, sub) { return '<div class="card ' + cls + '"><span>' + esc(label) + "</span><b>" + esc(value) + "</b>" + (sub ? "<small>" + esc(sub) + "</small>" : "") + "</div>"; }
function offerRow(name, price, list) {
  const exp = list.reduce((s, r) => s + (r.price || 0), 0), col = list.reduce((s, r) => s + (r.paid || 0), 0), owed = list.reduce((s, r) => s + (r.remaining > 0 ? r.remaining : 0), 0);
  return "<tr><td>" + esc(name) + '</td><td class="num">' + (price || "") + '</td><td class="num">' + list.length + '</td><td class="num">' + money(exp) + '</td><td class="num">' + money(col) + '</td><td class="num">' + money(owed) + "</td></tr>";
}
function ans(r, fld) { return fld ? (r.answers[fld.id] || "") : ""; }
function countBox(x, act) {
  const labels = x.type === "yesno" ? ["Yes", "No"] : x.options.map(o => en(o.label));
  const counts = {}; labels.forEach(l => counts[l] = 0);
  let blank = 0;
  act.forEach(r => {
    const a = r.answers[x.id];
    if (!a) { blank++; return; }
    (x.type === "checkbox" ? a.split(", ") : [a]).forEach(v => { counts[v] = (counts[v] || 0) + 1; });
  });
  const max = Math.max(1, ...Object.values(counts));
  return '<div class="count-box"><h4>' + esc(en(x.label)) + "</h4>" +
    Object.keys(counts).map(l => '<div class="bar-row"><span>' + esc(l) + '</span><div class="bar"><i style="width:' + (counts[l] / max * 100) + '%"></i></div><b>' + counts[l] + "</b></div>").join("") +
    (blank ? '<div class="bar-row muted"><span>No answer</span><div></div><b>' + blank + "</b></div>" : "") + "</div>";
}

function shownRows() {
  const k = keyFields(), q = search.trim().toLowerCase();
  return R.rows.map((r, i) => ({ r, i })).filter(({ r }) => {
    if (filter === "owing" && !(isActive(r) && r.remaining > 0)) return false;
    if (filter === "paid" && r.status !== "Paid") return false;
    if (filter === "nooffer" && !(isActive(r) && !r.offer)) return false;
    if (filter === "cancelled" && r.status !== "Cancelled") return false;
    if (q && (ans(r, k.child) + " " + ans(r, k.parent) + " " + ans(r, k.phone)).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}

function drawRows() {
  const body = document.getElementById("regBody");
  if (!body) return;
  const k = keyFields(), f = R.form;
  const list = shownRows();
  if (!list.length) { body.innerHTML = '<tr><td colspan="14" class="empty">' + (R.rows.length ? "Nothing matches." : "No registrations yet.") + "</td></tr>"; return; }
  body.innerHTML = list.map(({ r, i }) => {
    const offers = f.offers.filter(o => !o.hidden || o.name === r.offer);
    return '<tr data-i="' + i + '" class="' + (r.status === "Cancelled" ? "cancelled" : "") + '">' +
      "<td>" + (i + 1) + '</td><td class="muted">' + esc(r.received.slice(0, 10)) + "</td><td><b>" + esc(ans(r, k.child)) + "</b></td>" +
      (k.parent ? "<td>" + esc(ans(r, k.parent)) + "</td>" : "") + '<td dir="ltr">' + esc(ans(r, k.phone)) + "</td>" +
      '<td><select data-k="offer" aria-label="Offer"><option value="">Choose…</option>' +
        offers.map(o => '<option value="' + esc(o.name) + '"' + (o.name === r.offer ? " selected" : "") + ">" + esc(o.name) + "</option>").join("") +
        (r.offer && !offers.find(o => o.name === r.offer) ? '<option selected value="' + esc(r.offer) + '">' + esc(r.offer) + "</option>" : "") + "</select></td>" +
      '<td class="num" data-c="price">' + money(r.price) + "</td>" +
      '<td class="num"><input type="number" min="0" step="1" data-k="paid" value="' + (r.paid || "") + '" aria-label="Amount paid"></td>' +
      '<td class="num ' + (isOverdue(r) ? "over" : "") + '" data-c="remaining">' + (r.remaining == null ? "–" : money(r.remaining)) + "</td>" +
      '<td><input type="date" data-k="due" value="' + esc(r.due) + '" aria-label="Due date"></td>' +
      '<td><select data-k="method" aria-label="Payment method"><option value=""></option>' +
        f.methods.concat(r.method && f.methods.indexOf(r.method) < 0 ? [r.method] : []).map(m => '<option' + (m === r.method ? " selected" : "") + ">" + esc(m) + "</option>").join("") + "</select></td>" +
      '<td><span class="pill ' + statusClass(r.status) + '" data-c="status">' + esc(statusText(r.status)) + '</span><label class="cancel"><input type="checkbox" data-k="cancelled"' + (r.status === "Cancelled" ? " checked" : "") + "> cancelled</label></td>" +
      '<td><input class="note" type="text" data-k="notes" value="' + esc(r.notes) + '" aria-label="Notes"></td>' +
      '<td class="no-print"><span class="saving" id="sv-' + i + '"></span></td></tr>';
  }).join("");
}

// ---------- saving one row ----------
const busy = {}, again = {};
function updateRowCells(i) {
  const r = R.rows[i], tr = document.querySelector('#regBody tr[data-i="' + i + '"]');
  if (!tr) return;
  tr.className = r.status === "Cancelled" ? "cancelled" : "";
  tr.querySelector('[data-c="price"]').textContent = money(r.price);
  const rem = tr.querySelector('[data-c="remaining"]');
  rem.textContent = r.remaining == null ? "–" : money(r.remaining);
  rem.className = "num " + (isOverdue(r) ? "over" : "");
  const st = tr.querySelector('[data-c="status"]');
  st.className = "pill " + statusClass(r.status); st.textContent = statusText(r.status);
}
async function saveRow(i) {
  if (busy[i]) { again[i] = true; return; }      // a save is running: save again with the newest values after it
  busy[i] = true;
  const tr = document.querySelector('#regBody tr[data-i="' + i + '"]');
  const r = R.rows[i], sv = document.getElementById("sv-" + i);
  const val = k => tr.querySelector('[data-k="' + k + '"]');
  const data = { offer: val("offer").value, paid: val("paid").value, due: val("due").value, method: val("method").value, notes: val("notes").value, cancelled: val("cancelled").checked };
  if (sv) { sv.className = "saving"; sv.textContent = "Saving…"; }
  try {
    const j = await post({ action: "savePayment", password: PW, id: R.form.id, row: r.row, received: r.received, data: data });
    if (!j.ok) throw new Error(j.error);
    R.rows[i] = j.row;
    updateRowCells(i);
    renderSummary();
    if (sv && !again[i]) { sv.textContent = "Saved ✓"; setTimeout(() => { if (sv.textContent === "Saved ✓") sv.textContent = ""; }, 2500); }
  } catch (e) {
    if (sv) { sv.className = "saving err"; sv.textContent = "Not saved"; }
    toast(e instanceof TypeError ? "Can't reach the server. The change was not saved." : e.message, "err");
    again[i] = false;
  } finally {
    busy[i] = false;
    if (again[i]) { again[i] = false; saveRow(i); }
  }
}
window.addEventListener("beforeunload", e => { if (Object.values(busy).some(Boolean)) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("change", e => {
  const tr = e.target.closest("tr[data-i]");
  if (tr && e.target.dataset.k) saveRow(Number(tr.dataset.i));
});
document.addEventListener("click", e => {
  const c = e.target.closest("[data-filter]");
  if (c) { filter = c.dataset.filter; document.querySelectorAll("[data-filter]").forEach(b => b.setAttribute("aria-pressed", String(b === c))); drawRows(); }
});
document.addEventListener("input", e => { if (e.target.id === "search") { search = e.target.value; drawRows(); } });

// ---------- loading ----------
async function loadReport(id) {
  if (!id) { R = null; render(); return; }
  document.getElementById("report").innerHTML = '<p class="empty">Loading…</p>';
  try {
    const j = await post({ action: "report", password: PW, id: id });
    if (!j.ok) throw new Error(j.error);
    R = j; render();
    const u = new URL(location.href); u.searchParams.set("f", id); history.replaceState(null, "", u);
  } catch (e) {
    document.getElementById("report").innerHTML = '<p class="empty">' + esc(e instanceof TypeError ? "Can't reach the server." : e.message) + "</p>";
  }
}

async function login(pw) {
  const btn = document.getElementById("loginBtn"), err = document.getElementById("loginErr");
  btn.disabled = true; btn.textContent = "Signing in…"; err.textContent = "";
  try {
    const j = await post({ action: "staffLogin", password: pw });
    if (!j.ok) throw new Error(/Unknown action/.test(j.error || "") ? "The Apps Script is an older version. Ask the admin to deploy the new version." : j.error);
    PW = pw; FORMS = j.forms || []; BRAND = j.brand || {}; CUR = (j.currency && j.currency.en) || "EGP";
    try { sessionStorage.setItem("reshape_staff_pw", pw); } catch (e) {}
    if (/^#[0-9a-f]{6}$/i.test(BRAND.primary || "")) document.documentElement.style.setProperty("--primary", BRAND.primary);
    if (BRAND.logo) document.getElementById("logo").src = BRAND.logo;
    const sel = document.getElementById("formSel");
    sel.innerHTML = '<option value="">Choose a camp or event…</option>' + FORMS.map(f => '<option value="' + esc(f.id) + '">' + esc(en(f.title)) + (f.status === "closed" ? " (closed)" : "") + "</option>").join("");
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    const want = new URLSearchParams(location.search).get("f");
    const pick = FORMS.find(f => f.id === want) ? want : (FORMS.length === 1 ? FORMS[0].id : "");
    sel.value = pick;
    if (!FORMS.length) document.getElementById("report").innerHTML = '<p class="empty">No forms have answers sheets yet. A form gets one when it is saved as Open in the admin page.</p>';
    else loadReport(pick);
  } catch (e) {
    try { sessionStorage.removeItem("reshape_staff_pw"); } catch (x) {}
    err.textContent = e instanceof TypeError ? "Can't reach the server. Check config.js and your internet." : e.message;
  } finally { btn.disabled = false; btn.textContent = "Sign in"; }
}

document.getElementById("loginForm").addEventListener("submit", e => { e.preventDefault(); login(document.getElementById("pw").value); });
document.getElementById("formSel").addEventListener("change", e => { filter = "all"; search = ""; loadReport(e.target.value); });
document.getElementById("refreshBtn").addEventListener("click", () => loadReport(document.getElementById("formSel").value));
document.getElementById("printBtn").addEventListener("click", () => window.print());
document.getElementById("logoutBtn").addEventListener("click", () => { try { sessionStorage.removeItem("reshape_staff_pw"); } catch (e) {} location.href = location.pathname; });

(function start() {
  if (!API || API.indexOf("PASTE_") === 0) { document.getElementById("loginErr").textContent = "Paste your Apps Script web app URL in config.js first."; document.getElementById("loginBtn").disabled = true; return; }
  let saved = ""; try { saved = sessionStorage.getItem("reshape_staff_pw") || ""; } catch (e) {}
  if (saved) login(saved);
})();
</script>
</body>
